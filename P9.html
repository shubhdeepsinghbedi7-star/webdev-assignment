
<!DOCTYPE html>
<html>

<head>
  <title>Flexbox Card Layout</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: lightcoral;
    }

    nav h1 {
      margin: 0;
      color: white;
    }

    nav ul {
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 30px;
    }

    .card {
      flex: 1 1 250px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .card h2 {
      margin-top: 0;
    }

    @media (max-width: 600px) {
      nav {
        flex-direction: column;
        gap: 15px;
      }

      nav ul {
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .cards {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<nav>
  <h1>My Website</h1>

  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</nav>

<main>
  <section class="cards">

    <article class="card">
      <h2>HTML</h2>
      <p>
        HTML provides the structure of a webpage.
      </p>
    </article>

    <article class="card">
      <h2>CSS</h2>
      <p>
        CSS controls the appearance and layout of a webpage.
      </p>
    </article>

    <article class="card">
      <h2>JavaScript</h2>
      <p>
        JavaScript adds interaction and dynamic behavior.
      </p>
    </article>

    <article class="card">
      <h2>Java</h2>
      <p>
        Java is a programming language used to build applications.
      </p>
    </article>

  </section>
</main>

</body>

</html>
