<!DOCTYPE html>
<html>
    <head>
        <title>
            Bosscoder Notice Page
        </title>
        <style>
            body{
                margin: 0;
                background-color: lightgray;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1.5;
            }

            header{
                text-align: center;
                padding; 20px;
                background-color: : lightblue;
            }

            h1{
                color: rgb(76, 76, 138);
                font-size: 30px;
            }

            header h2 {
                color: gray;
                font-size: 18px;
                font-weight: normal;
            }
            
            #notice-container{
                background-color: white;
                width: 100%;
                margin: 30px auto;
                padding:20px;
                border: 2px solid gray;
                box-sizing: border-box;
            }

            #notice-container > h2{
                text-align: center;
                color: rgb(190, 90, 90);
            }

            .notice{
                background-color: whitesmoke;
                width: 100%;
                padding: 15px;
                margin: 100px 0;
                border: 1px solid lightgray;
                box-sizing: border-box;
                display: block;
            }

            .notice h3{
                color: navy;
                font-size: 18px;
            }

            .notice p{
                font-size: 14px;
            }

            button{
                background-color: rgb(123, 123, 177);
                color: white;
                padding: 8px 15px;
                border: none;
            }

            button:hover{
                background-color: darkblue;
            }

            footer{
                background-color: rgb(109, 109, 176);
                color: white;
                text-align: center;
                padding: 15px;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Bosscoder School of Technology</h1>
            <h2>Department of CSE</h2>
        </header>
        
        <main id="notice-container">

            <h2>Important Notices</h2>

            <div class="notice">
                <h3>1. Internal Assessment</h3>
                <p>Date: 6 January 2027</p>
                <button>Read More</button>
            </div>
            <div class="notice">
                <h3>2. Web Development Lab</h3>
                <p>Date: 8 January 2027</p>
                <button>Read More</button>
            </div>
            <div class="notice">
                <h3>3. Student Workshop</h3>
                <p>14 January 2027</p>
                <button>Read More</button>
            </div>
        </main>
        <footer>
            Department of CSE
        </footer>
    </body>
</html>
