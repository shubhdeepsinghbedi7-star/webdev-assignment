<!DOCTYPE html>
<html>
<head>
    <title>4 Card Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 250px 250px;
            grid-template-rows: 180px 180px;
            gap: 20px;
        }

        .card {
            background-color: rgb(121, 108, 155);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
        .card2 {
            background-color: rgb(56, 211, 69);
            border: 2px solid rgb(158, 43, 43);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <h3> My four card grid</h3>

    <div class="container">
        <div class="card">Card 1</div>
        <div class="card2">Card 2</div>
        <div class="card">Card 3</div>
        <div class="card">Card 4</div>
    </div>

</body>
</html>
