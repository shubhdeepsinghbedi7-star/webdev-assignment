<!DOCTYPE html>
<html>
<head>
    <title>4 Column Grid</title>

    <style>
        .container {
            display: grid;

            grid-template-columns: repeat(4, minmax(120px, 1fr));

            gap: 15px;
        }

        .box {
            border: 2px solid black;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>4 Column Grid</h1>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>

    </div>

</body>
</html>
