<!DOCTYPE html>
<html>
<head>
  <style>
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 200px);
      gap: 10px;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo1 {
      grid-column: 1 / 3;
      grid-row: 1 / 3;
    }

    .photo2 {
      grid-column: 3;
      grid-row: 1;
    }

    .photo3 {
      grid-column: 4;
      grid-row: 1;
    }

    .photo4 {
      grid-column: 3;
      grid-row: 2;
    }

    .photo5 {
      grid-column: 4;
      grid-row: 2;
    }

    .photo6 {
      grid-column: 1 / 5;
      grid-row: 3;
    }
  </style>
</head>

<body>

  <div class="gallery">
    <img class="photo1" src="img1.jpg">
    <img class="photo2" src="img2.jpg">
    <img class="photo3" src="img3.jpg">
    <img class="photo4" src="img4.jpg">
    <img class="photo5" src="img5.jpg">
    <img class="photo6" src="img6.jpg">
  </div>

</body>
</html>
