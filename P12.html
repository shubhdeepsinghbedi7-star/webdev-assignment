<!DOCTYPE html>
<html>
<head>
    
    <title>Portfolio Projects</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        .projects {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .projects h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 40px;
        }


        .project-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 180px;
            gap: 20px;
        }


        .project-card {
            padding: 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .project-card h2 {
            margin: 0 0 8px;
        }

        .project-card p {
            margin: 0;
            line-height: 1.5;
        }


        .project-1 {
            grid-column: span 2;
            grid-row: span 2;
            background: #dbeafe;
        }

        .project-2 {
            grid-column: span 2;
            background: #dcfce7;
        }

        .project-3 {
            grid-column: span 1;
            grid-row: span 2;
            background: #fef3c7;
        }

        .project-4 {
            grid-column: span 1;
            background: #fce7f3;
        }

        .project-5 {
            grid-column: span 2;
            background: #ede9fe;
        }

        .project-6 {
            grid-column: span 1;
            background: #cffafe;
        }


        @media (max-width: 800px) {
            .project-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .project-1,
            .project-2,
            .project-5 {
                grid-column: span 2;
            }

            .project-3 {
                grid-column: span 1;
            }
        }

        @media (max-width: 500px) {
            .project-grid {
                grid-template-columns: 1fr;
                grid-auto-rows: auto;
            }

            .project-card {
                min-height: 180px;
            }

            .project-1,
            .project-2,
            .project-3,
            .project-4,
            .project-5,
            .project-6 {
                grid-column: span 1;
                grid-row: span 1;
            }
        }
    </style>
</head>

<body>

    <section class="projects">

        <h1>My Projects</h1>

        <div class="project-grid">

            <article class="project-card project-1">
                <h2>Huslerz</h2>
                <p>
                    My second SEMI-FAIED Startup..
                </p>
            </article>

            <article class="project-card project-2">
                <h2>LazyLearner</h2>
                <p>
                    somthing that i actually made.
                    Never used it ngl.
                </p>
            </article>

            <article class="project-card project-3">
                <h2>Portfolio Website</h2>
                <p>
                    Not a single sample.
                </p>
            </article>

            <article class="project-card project-4">
                <h2>Weather App</h2>
                <p>
                    Never made tbh......
                </p>
            </article>

            <article class="project-card project-5">
                <h2>Hackathon Project</h2>
                <p>
                    Straight SIH.
                </p>
            </article>

            <article class="project-card project-6">
                <h2>Java Projects</h2>
                <p>
                    NONE lol :3.
                </p>
            </article>

        </div>

    </section>

</body>
</html>
